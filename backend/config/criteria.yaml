# Pipeline configuration
# Storage paths are relative to the repo root.

storage:
  input_dir: "input_data/houses"
  output_dir: "outputs/houses"

# Filter criteria configuration
# Each key maps to a filter's expected criteria fields.
#
# p1 = must-have (ALL must match)
# p2 = nice-to-have (ANY must match)

text_filter:
  p1_keywords:
    - "garden"
  p2_keywords:
    - "garage"
    - "dishwasher"
  excluded_keywords:
    - "highway"
    - "industrial"

distance:
  destinations:
    - name: "Amsterdam Central"
      address: "Amsterdam Centraal, Amsterdam"
      modes: ["transit", "cycling"]
    - name: "Office"
      address: "Zuidas, Amsterdam"
      modes: ["driving", "transit"]
      
llm_text_filter:
  p1_criteria:
    - "has a private garden or outdoor space"
    - "has at least 3 bedrooms"
  p2_criteria:
    - "has a garage or covered parking"
    - "has a modern kitchen with dishwasher"
  excluded_criteria:
    - "located near a highway or industrial area"
    - "requires major renovation"

photo_criteria:
  kitchen:
    required: ["dishwasher", "oven", "sink"]
    preferred: ["island", "modern_cabinets"]
  bathroom:
    required: ["shower_or_bath", "toilet"]
    preferred: ["double_sink", "heated_floor"]
  bedroom:
    required: ["bed"]
    preferred: ["built_in_wardrobe", "natural_light"]
  living_room:
    required: []
    preferred: ["fireplace", "natural_light", "open_plan"]
