# Pipeline configuration
# Storage paths are relative to the repo root.

storage:
  input_dir: "input_data/houses"
  output_dir: "outputs/houses"

# ─── Stage 1: Text filter ─────────────────────────────────────────────────────
# Keyword matching on listing text (fast, no LLM).
text_filter:
  p1_keywords:
    - "garden"
  p2_keywords:
    - "garage"
    - "dishwasher"
  excluded_keywords:
    - "highway"
    - "industrial"

# ─── Stage 2: Room classifier ─────────────────────────────────────────────────
# (no extra config — runs on all photos, writes room_classifications.json)

# ─── Stage 3a: Room type filter ───────────────────────────────────────────────
# Checks room types detected by the classifier against criteria.
room_filter:
  p1_room_types: []
  p2_room_types:
    - "garden"
    - "garage"
  excluded_room_types: []

# ─── Stage 3b: Photo criteria checker ─────────────────────────────────────────
# Vision LLM checks required/preferred features per room type.
photo_criteria:
  kitchen:
    required: ["oven", "sink"]
    preferred: ["island", "modern_cabinets"]
  bathroom:
    required: ["shower_or_bath", "toilet"]
    preferred: ["double_sink", "heated_floor"]
  bedroom:
    required: ["bed"]
    preferred: ["built_in_wardrobe", "natural_light"]
  living_room:
    required: []
    preferred: ["fireplace", "natural_light", "open_plan"]

# ─── Stage 3c: Distance / commute filter ──────────────────────────────────────
# Azure Maps routing — requires AZURE_MAPS_KEY env var.
# Add destinations below; leave list empty to skip distance checking.
distance:
  destinations:
    - name: "Amsterdam Central"
      address: "Amsterdam Centraal, Amsterdam"
      modes: ["transit", "cycling"]
      max_commute_minutes: 45
    # - name: "Office"
    #   address: "Zuidas, Amsterdam"
    #   modes: ["driving", "transit"]
    #   max_commute_minutes: 30
